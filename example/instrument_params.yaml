_comment: "
Name: Instrument Params
Created by: Cyrus Yiu (@UnsignedArduino), with parts generated and/or tuned 
 from Claude AI's output

For https://github.com/UnsignedArduino/MIDI-to-MakeCode-Arcade

Full GM1 support, minimal GM2 support (the extended GM2 drum notes, but only 
the standard kit), and very minimal Roland GS/Yamaha XG support (parsing 
specific SysEx messages for drum kit changes)

Units:
  Attack, decay, release: milliseconds
  Sustain and amplitudes: range 0-1024
  LFO frequencies: hz

Waveforms map to as expected by MakeCode Arcade:
  triangle = 1
  sawtooth = 2
  sine = 3
  noise_tunable = 4
  noise = 5
  square_10 = 11
  square_20 = 12
  square_30 = 13
  square_40 = 14
  square_50 (or square) = 15
  cycle_16 = 16
  cycle_32 = 17
  cycle_64 (or noise_tunable_2) = 18

https://arcade.makecode.com/developer/sound
> The noise is an actual white noise. It ignores the requested frequency or 
> note.
> 
> The tunable noise tone contains a pseudorandom sample. At high frequency it 
> sounds similar to white noise, at low frequency it produces irregular 
> crackling noises.
> 
> The cycle 16, cycle 32, and cycle 64 waveforms are repeating pseudorandom 
> patterns with a cycle length of 16/32/64 samples respectively. They sound 
> like a noise-distorted square wave, with short cycles being more regular and 
> long cycles being noisier.

For testing melodic instrument parameters, you can use this, by Richard
https://arcade.makecode.com/18336-29202-55655-79439

About melodic pitch compensation: 

  If you tuned all melodic instruments with the same song, then you could be 
  ex. tuning a bass with higher-than-typical notes, and a flute with lower-
  than-normal notes. Thus, a flute playing at in its regular range will 
  overpower the bass, due to Fletcher-Munson curves. But here, we just use a 
  compensation factor, so lower pitches relative to MIDI note 60 are boosted, 
  and higher pitches are attenuated. 

  With k=0.35, one octave up is at 79% amplitude, two octaves up is at 62% 
  amplitude, and one octave down is at 127% amplitude. Currently, this k factor 
  is global. Set k=0 or remove it to disable if you tuned instruments with 
  their correct ranges. 
"
melodic_pitch_comp_k: 0.1
