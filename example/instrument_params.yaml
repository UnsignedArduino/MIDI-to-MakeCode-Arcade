_comment: "
This file was generated by Gemini for testing purposes. 

Units:
  Attack, decay, release: milliseconds
  Sustain and amplitudes: range 0-1024
  LFO frequencies: hz

Waveforms map to as expected by MakeCode Arcade:
  triangle = 1
  sawtooth = 2
  sine = 3
  noise_tunable = 4
  noise = 5
  square_10 = 11
  square_20 = 12
  square_30 = 13
  square_40 = 14
  square_50 (or square) = 15
  cycle_16 = 16
  cycle_32 = 17
  cycle_64 (or noise_tunable_2) = 18

https://arcade.makecode.com/developer/sound
> The noise is an actual white noise. It ignores the requested frequency or 
> note.
> 
> The tunable noise tone contains a pseudorandom sample. At high frequency it 
> sounds similar to white noise, at low frequency it produces irregular 
> crackling noises.
> 
> The cycle 16, cycle 32, and cycle 64 waveforms are repeating pseudorandom 
> patterns with a cycle length of 16/32/64 samples respectively. They sound 
> like a noise-distorted square wave, with short cycles being more regular and 
> long cycles being noisier.
"
