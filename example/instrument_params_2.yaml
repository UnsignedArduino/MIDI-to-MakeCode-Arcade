_comment: "
This file was generated by Claude for testing purposes. 

Units:
  Attack, decay, release: milliseconds
  Sustain and amplitudes: range 0-1024
  LFO frequencies: hz

Waveforms map to as expected by MakeCode Arcade:
  triangle = 1
  sawtooth = 2
  sine = 3
  noise_tunable = 4
  noise = 5
  square_10 = 11
  square_20 = 12
  square_30 = 13
  square_40 = 14
  square_50 (or square) = 15
  cycle_16 = 16
  cycle_32 = 17
  cycle_64 (or noise_tunable_2) = 18

https://arcade.makecode.com/developer/sound
> The noise is an actual white noise. It ignores the requested frequency or 
> note.
> 
> The tunable noise tone contains a pseudorandom sample. At high frequency it 
> sounds similar to white noise, at low frequency it produces irregular 
> crackling noises.
> 
> The cycle 16, cycle 32, and cycle 64 waveforms are repeating pseudorandom 
> patterns with a cycle length of 16/32/64 samples respectively. They sound 
> like a noise-distorted square wave, with short cycles being more regular and 
> long cycles being noisier.
"
_comment2: 'MakeCode Arcade GM1/GM2 instrument parameter map. All envelope times in ms. sustain/amplitude values 0-1024. LFO
  frequency in Hz. Waveforms: triangle=1 sawtooth=2 sine=3 noise_tunable=4 noise=5 square_10=11 square_20=12 square_30=13
  square_40=14 square_50=15 cycle_16=16 cycle_32=17 cycle_64=18. noise ignores pitch. noise_tunable is pitch-dependent (high=white
  noise, low=crackling). cycle_N are periodic pseudo-random patterns (shorter = more regular). Drum notes: GM2 extended range
  27-87 (GM1 was 35-81). Notes 71-74 and 78-79 are unassigned in both GM1 and GM2.'
