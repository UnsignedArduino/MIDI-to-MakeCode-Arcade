repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [ python ]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [ python ]
        pass_filenames: true

      - id: mypy
        name: mypy
        # One run over the whole project: per-file batches (run in parallel)
        # can miss src/, and then mypy treats midi2mkcd as an untyped
        # installed package
        entry: uv run mypy src tests
        language: system
        types: [ python ]
        pass_filenames: false
